services:
  # ========================================================
  # 1. AgriConnect Backend REST API (Render Web Service)
  # ========================================================
  - type: web
    name: agriconnect-api
    runtime: node
    plan: free
    region: oregon
    rootDir: server
    buildCommand: npm install
    startCommand: node src/app.js
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: JWT_SECRET
        generateValue: true

  # ========================================================
  # 2. AgriConnect Frontend Client (Render Static Site)
  # ========================================================
  - type: static
    name: agriconnect-ui
    plan: free
    region: oregon
    rootDir: client
    buildCommand: npm install && npm run build
    staticPublishPath: ./dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        fromService:
          type: web
          name: agriconnect-api
          property: host
